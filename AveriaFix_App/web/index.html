<html>
    <head>
        <title>AveriaFix</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="recursos/logo.png" type="image/x-icon">
        <link rel="stylesheet" href="estilos/index.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container-fluid d-flex justify-content-center align-items-center flex-column" style="height: 100vh;">
            <div class="imagen_inicio mb-3">
                <img class="imagen_index img-fluid" src="recursos/logo.png" alt="AveriaFix.png"/>
            </div>
            <div class="texto_inicio mb-3 text-center">
                <h2>AveríaFix | SysMovTech</h2>
            </div>
            <form class="inicio_sesion w-100" action="notificaciones.jsp">
                <p class="titulo_sesion text-center">Iniciar Sesión</p>
                <p class="texto_sesion text-center"> Para acceder al sitio web, primero debes autenticarte<br>con tu número de trabajador y contraseña</p><br>
                <div class="mb-3">
                    <input type="text" class="input_sesion form-control" placeholder="Número de trabajador" name="user"><br><br>
                </div>
                <div class="mb-3">
                    <input type="password" class="input_sesion form-control" placeholder="Contraseña" name="password"><br><br>
                </div>
                <div class="text-center">
                    <input type="submit" value="Continuar" class="submit_sesion btn btn-dark w-100">
                </div>
                <p class="texto_politicas text-center mt-3">Al continuar, reconoces que comprendes y aceptas los <br> <a href="" class="link">Términos y condiciones</a>
                y la <a href="" class="link" >Política de privacidad</a></p>
            </form>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
