<!DOCTYPE html>
<html>
    <head>
        <title>AveriaFix</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="recursos/logo.png" type="image/x-icon">
        <link rel="stylesheet" href="estilos/index.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="contenedor_sup">
            <div class="sup_inicio">
                <img class="imagen_index" src="recursos/logo.png" alt="AveriaFix.png"/>
                <div class="texto_inicio">AveríaFix &nbsp;<span class="sep">|</span> &nbsp;SysMovTech</div>
            </div>
        </div>
        <div class="contenedor">
            <form class="inicio_sesion" action="notificaciones.jsp">
                <p class="titulo_sesion">Iniciar Sesión</p>
                <p class="texto_sesion"> Para acceder al sitio web, primero debes autenticarte con tu número de trabajador y contraseña</p><br>
                <input type="text" class="input_sesion" placeholder="Número de trabajador"><br><br>
                <input type="password" class="input_sesion" placeholder="Contraseña"><br><br>
                <input type="submit" value="Continuar" class="submit_sesion">
                <p class="texto_politicas">
                    Al continuar, reconoces que comprendes y aceptas los 
                    <a href="" class="link">Términos y condiciones</a> y la 
                    <a href="" class="link" >Política de privacidad</a>
                </p>
            </form>
        </div>
    </body>
</html>
